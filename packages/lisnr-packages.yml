distribution_model:
  public_registries: false
  summary: >-
    LISNR does not publish its client SDKs to any public package registry. SDKs, sample projects and their
    documentation are gated behind the LISNR Portal: an authenticated account calls GET /v2/sdk-releases and
    the per-platform Developer Resources pages render download links for the SDK generations that the
    account is licensed for. There is therefore no `npm install` / `pip install` / Maven coordinate to
    record, and no public SDK a non-customer can obtain.
  gated_endpoint: openapi/lisnr-portal-openapi-derived.json#listSdkReleases
  gated_pages:
  - https://portal.lisnr.com/developer-resources/android/
  - https://portal.lisnr.com/developer-resources/ios/
  - https://portal.lisnr.com/developer-resources/react-native/
  - https://portal.lisnr.com/developer-resources/linux/
  - https://portal.lisnr.com/developer-resources/windows/
  entitlement: >-
    Which SDK generations appear is driven by the account `products` array (legacy, radius, radius3, point,
    sda) returned by GET /v2/accounts.
packages: []
