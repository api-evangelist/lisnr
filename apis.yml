aid: lisnr
name: LISNR
description: >-
  LISNR is a Cincinnati, Ohio company whose ultrasonic data-over-audio technology transmits data between
  devices using inaudible high-frequency tones instead of radio. Its Radius SDKs (Radius, Radius 3, Point,
  and the legacy and SDA product lines) embed a transmitter/receiver into iOS, Android, React Native, Linux
  and Windows applications so that a speaker and a microphone become a proximity data channel for contactless
  payment, identification, confirmation and device-pairing transactions. Developers work through the LISNR
  Portal, which issues per-application API tokens and SDK tokens, exposes SDK releases and sample projects,
  and provides a Tone Creator and a tone-speed calculator. The public Tones Service API generates a
  downloadable 24-bit audio tone (WAV or MP3) from a hexadecimal payload for a chosen tone profile, with
  optional AES-256 payload encryption and ToneLock pairing so that only matching receivers can demodulate
  the tone.
