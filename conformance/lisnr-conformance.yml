standards:
- id: openapi-3.0
  conforms: true
  evidence: >-
    LISNR publishes an OpenAPI 3.0.1 document for the Tones Service API, rendered with ReDoc 2.0.0-rc.45 at
    portal.lisnr.com/assets/tones-docs/tones-docs.html.
  caveats:
  - >-
    The document is not strictly valid: it $refs #/components/APITokenHeader and #/components/PayloadProperty,
    which sit at the root of components rather than under components/parameters and components/schemas. It
    also omits info.version, operationId, and tags. These are corrected in overlays/lisnr-tones-overlay.yaml.
- id: oauth2
  conforms: false
  evidence: No oauth2 security scheme in any spec and no OAuth documented; authentication is a header API key.
- id: oidc
  conforms: false
  evidence: /.well-known/openid-configuration returns 404 on api.lisnr.com; no OIDC surface.
- id: rfc6750-bearer
  conforms: false
  evidence: >-
    The Authorization header carries the literal prefix "JWT " rather than the RFC 6750 "Bearer " prefix, so
    the scheme is a header API key rather than a conformant bearer token, even though the credential is a JWT.
- id: rfc7519-jwt
  conforms: true
  evidence: >-
    Credentials are documented as JWTs by LISNR ("An API Token prefixed by JWT", example "JWT eyJ..."), and
    the observed Portal client sends them unchanged.
- id: rfc9457-problem-details
  conforms: false
  evidence: >-
    Errors are application/json objects carrying a single `message` string, not application/problem+json.
    See errors/lisnr-problem-types.yml.
- id: json-api
  conforms: false
  evidence: >-
    Responses use a proprietary `{ "result": ... }` envelope on the Portal API and a flat object on Tones.
- id: rfc9116-security-txt
  conforms: false
  evidence: No /.well-known/security.txt on any LISNR host. See well-known/lisnr-well-known.yml.
- id: rfc8594-sunset-header
