format: proprietary
rfc9457: false
note: >-
  LISNR does not use RFC 9457 problem+json. Errors are plain application/json objects. The Tones Service API
  returns a flat object with a single `message` string; the Portal API wraps the same shape inside its
  `result` envelope (`{"result": {"message": "..."}}`). There is no machine-readable error code, error type
  URI, or field-level error detail on either surface, so clients must branch on HTTP status and, where they
  must distinguish causes, on the human-readable message string.
envelope:
  tones_service: '{ "message": "<string>" }'
  portal: '{ "result": { "message": "<string>" } }'
problems:
