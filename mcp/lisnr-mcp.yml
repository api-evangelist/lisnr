tools:
- name: create_tone
  description: >-
    Generate an ultrasonic LISNR tone from a hexadecimal payload and return a signed URL, valid for
    twenty-four hours, to the resulting audio file.
  source_operation: openapi/lisnr-tones-openapi-original.json#createTone
  action_class: acting
  consequence: write
  idempotent: false
  agent_notes: >-
    Not idempotent — each call mints a new artifact and consumes account quota. Validate the payload against
    the profile byte limit before calling, and subtract the encryption overhead (2 bytes for zone66, 4 for
    all other profiles) when encrypt is true.
